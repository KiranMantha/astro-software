<div class="select">
  <label class="label" [for]="inputId">{{ label }}</label>
  <select [id]="inputId" [name]="fieldName" [ngModel]="value" (change)="onModelChange($event)">
    @for (opt of options; track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
</div>
